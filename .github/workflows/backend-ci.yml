name: Backend CI 

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: easyground_test
          POSTGRES_USER: easyground_admin
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U easyground_admin -d easyground_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://easyground_admin:ci_test_password@127.0.0.1:5432/easyground_test?sslmode=disable

    defaults:
      run:
        working-directory: src/backend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: 
          persist-credentials: false
    
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.mod
          
      - name: Prepare database role
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U easyground_admin -d easyground_test \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE easyground_app NOLOGIN;"

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.30.1  
      
      - name: Apply migrations
        env:
          GOOSE_DRIVER: postgres
          GOOSE_DBSTRING: ${{ env.TEST_DATABASE_URL }}
        run: goose -env=none -dir db/migrations up

      - name: Static analysis
        run: go vet ./...

      - name: Tests
        run: go test -v ./...

      - name: Build
        run: go build ./...
